# Linux-Artefakte, die noch keine eigene Seite haben (siehe hooks/gaps.py).
# Jeder Eintrag hat genau ein Topic (Schlüssel aus extra.topics in mkdocs.base.yml); die Seite
# gruppiert danach. Bekommt ein Eintrag eine Seite, wird er hier gelöscht.
# Artefakte einer bestimmten Desktop-Umgebung stehen in gaps/artifacts/linux/<desktop>.yml
# (gnome.yml, kde.yml). Hier stehen systemweite Artefakte und solche nach freedesktop.org-Standards,
# die für alle Desktop-Umgebungen gelten.

- name: auditd
  topic: program-execution
- name: systemd-coredump
  topic: program-execution
- name: .xsession-errors
  topic: program-execution

- name: Paketverwaltung (dpkg/apt, dnf/yum, pacman)
  topic: installed-software
- name: Snap / Flatpak
  topic: installed-software
- name: .desktop-Dateien (Programmstarter)
  topic: installed-software

- name: Editor-/Tool-Historien (viminfo, lesshst, python_history)
  topic: file-access
- name: CUPS-Druckaufträge
  topic: file-access
- name: Zeitgeist (Pantheon / elementary OS)
  topic: file-access

- name: Papierkorb (Trash)
  topic: file-existence
- name: Snapshots (Timeshift, Snapper, Btrfs)
  topic: file-existence

- name: Shell-History (bash, zsh)
  topic: commands-input

- name: wtmp / btmp / lastlog
  topic: accounts
- name: sudo-Protokollierung
  topic: accounts
- name: Benutzerkonten (passwd, shadow, group)
  topic: accounts
- name: auth.log / secure
  topic: accounts

- name: SSH (known_hosts, authorized_keys)
  topic: network
- name: NetworkManager-Verbindungen
  topic: network
- name: Firewall-Log (ufw)
  topic: network

- name: systemd-Journal
  topic: device-state
- name: syslog / messages / kern.log
  topic: device-state

- name: Bluetooth (/var/lib/bluetooth)
  topic: external-devices
- name: USB / udev
  topic: external-devices

- name: Systeminformationen
  topic: system-config
- name: fstab / Mounts
  topic: system-config

- name: cron / systemd-Timer und -Units
  topic: persistence
- name: XDG-Autostart
  topic: persistence
